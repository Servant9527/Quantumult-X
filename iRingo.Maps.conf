# 苹果地图区域修改

[rewrite_local]
^https?:\/\/configuration\.ls\.apple\.com\/config\/defaults url script-request-body https://raw.githubusercontent.com/Servant9527/Surge/main/JS%20folder/request.bundle.js
^https?:\/\/configuration\.ls\.apple\.com\/config\/defaults, requires-body=1, engine=webview url script-response-body https://raw.githubusercontent.com/Servant9527/Surge/main/JS%20folder/response.bundle.js
^https?:\/\/gspe35-ssl\.ls\.apple\.(com|cn)\/config\/announcements url script-request-body https://raw.githubusercontent.com/Servant9527/Surge/main/JS%20folder/request.bundle.js
^https?:\/\/gspe35-ssl\.ls\.apple\.(com|cn)\/config\/announcements, requires-body=1, binary-body-mode=1, engine=webview url script-response-body https://raw.githubusercontent.com/Servant9527/Surge/main/JS%20folder/response.bundle.js
^https?:\/\/gspe35-ssl\.ls\.apple\.(com|cn)\/geo_manifest\/dynamic\/config url script-request-body https://raw.githubusercontent.com/Servant9527/Surge/main/JS%20folder/request.bundle.js
^https?:\/\/gspe35-ssl\.ls\.apple\.(com|cn)\/geo_manifest\/dynamic\/config, requires-body=1, binary-body-mode=1, engine=webview url script-response-body https://raw.githubusercontent.com/Servant9527/Surge/main/JS%20folder/response.bundle.js

[mitm]
hostname =  configuration.ls.apple.com, gspe35-ssl.ls.apple.com

