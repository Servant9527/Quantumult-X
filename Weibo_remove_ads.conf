# 微博去广告
# 过滤微博广告及去除各部分推广模块

[rewrite_local]
(?i)^https:\/\/api\.weibo\.cn\/2\/(?:checkin\/show|client\/publisher_list|push\/active) url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/api\.weibo\.cn\/2\/groups\/allgroups\/v2\? url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/api\.weibo\.cn\/2\/(?:cardlist|page) url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/api\.weibo\.cn\/2\/comments\/build_comments\? url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/api\.weibo\.cn\/2\/(?:container\/asyn|flowlist|flowpage) url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/api\.weibo\.cn\/2\/friendships\/(?:create|destroy) url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/api\.weibo\.cn\/2\/profile\/(?:container_timeline|dealatt|me|statuses\/tab|userinfo) url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/api\.weibo\.cn\/2\/shproxy\/chaohua\/discovery\/searchactive\? url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/api\.weibo\.cn\/2\/statuses\/(?:comments_expand_child|container_detail_comment) url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/api\.weibo\.cn\/2\/statuses\/(?:container_detail\?|container_timeline(?:_hot|_topic|_topicpage|_unread)?|repost_timeline|unread_hot_timeline) url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/api\.weibo\.cn\/2\/statuses\/(?:extend|show)\? url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/api\.weibo\.cn\/2\/video\/(?:full_screen_stream|tiny_stream_mid_detail|tiny_stream_video_list)\? url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/api\.weibo\.cn\/2\/!\/huati\/discovery_home_bottom_channels\? url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/api\.weibo\.cn\/2\/direct_messages\/user_list\? url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/api\.weibo\.cn\/2\/messageflow\/notice\? url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/api\.weibo\.cn\/2\/search\/(?:container_timeline|finder)\? url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/api\.weibo\.cn\/2\/searchall\? url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/bootpreload\.uve\.weibo\.com\/v[12]\/ad\/preload url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/sdkapp\.uve\.weibo\.com\/interface\/sdk\/sdkad\.php url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js
(?i)^https:\/\/wbapp\.uve\.weibo\.com\/(?:preload\/get_ad|wbapplua\/wbpullad\.lua) url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Weibo_remove_ads.js

[mitm]
hostname =  *.weibo.cn, *.weibo.com, weibo.com

