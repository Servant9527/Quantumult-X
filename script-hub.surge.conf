# 脚本转换
# https://script.hub

[rewrite_local]
^https?:\/\/script\.hub\/($|edit\/|reload) url script-request-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/script-hub.js
^https?:\/\/script\.hub\/file\/_start_\/.+type=(?:qx-rewrite|surge-module|loon-plugin|all-module) url script-request-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/Rewrite-Parser.js
^https?:\/\/script\.hub\/file\/_start_\/.+type=rule-set url script-request-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/rule-parser.js
^https?:\/\/script\.hub\/convert\/ url script-request-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/script-converter.js

[mitm]
hostname =  script.hub, *.script.hub

# [General] 需手动转换:
# force-http-engine-hosts = %APPEND% script.hub, *.script.hub
