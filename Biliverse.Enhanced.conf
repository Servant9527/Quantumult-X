# Biliverse增强

[rewrite_local]
^https:\/\/(?:biliverse\.github\.io|app\.bilibili\.com)\/api\/(?:get|set|delete)(?:\?.*)?$, requires-body=1, max-size=65536 url script-request-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/api.js
^https?:\/\/app\.bili(bili\.com|api\.net)\/x\/resource\/show\/tab\/v2\?, requires-body=1 url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/response.bundle.js
^https?:\/\/(grpc|app)\.bili(bili\.com|api\.net)\/bilibili\.app\.show\.v1\.Mixture\/RegionShortcut$, requires-body=1, binary-body-mode=1, engine=webview url script-request-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/request.bundle.js
^https?:\/\/(grpc|app)\.bili(bili\.com|api\.net)\/bilibili\.app\.show\.v1\.Mixture\/RegionList$, requires-body=1, binary-body-mode=1, engine=webview, max-size=262144 url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/response.bundle.js
^https?:\/\/app\.bili(bili\.com|api\.net)\/x\/v2\/account\/mine(\/ipad)?\?, requires-body=1 url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/response.bundle.js
^https?:\/\/app\.bili(bili\.com|api\.net)\/x\/v2\/region\/index\?, requires-body=1 url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/response.bundle.js
^https?:\/\/app\.bili(bili\.com|api\.net)\/x\/v2\/channel\/region\/list\?, requires-body=1 url script-response-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/response.bundle.js

[mitm]
hostname =  biliverse.github.io, app.bilibili.com, app.biliapi.net, grpc.biliapi.net

