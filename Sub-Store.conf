# Sub-Store
# 支持 Surge 正式版的参数设置功能. 测落地功能 ability: http-client-policy, 同步配置的定时 cronexp: 55 23 * * *

[rewrite_local]
^https?:\/\/sub\.store\/((download)|api\/(preview|sync|(utils\/node-info))) url script-request-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/sub-store-1.min.js
^https?:\/\/sub\.store url script-request-body https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/sub-store-0.min.js
# TODO(script): {{{sync}}}=type=cron,cronexp="{{{cronexp}}}",wake-system=1,timeout={{{timeout}}},script-path=https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/cron-sync-artifacts.min.js,engine={{{engine}}},argument="sync_success_notify={{{sync_success_notify}}}"
# TODO(script): {{{produce}}}=type=cron,cronexp="{{{produce_cronexp}}}",wake-system=1,timeout={{{timeout}}},script-path=https://raw.githubusercontent.com/Servant9527/Quantumult-X/main/JS%20folder/cron-sync-artifacts.min.js,engine={{{engine}}},argument="sub={{{produce_sub}}}&col={{{produce_col}}}"

[mitm]
hostname =  sub.store
