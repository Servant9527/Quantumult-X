# YouTube（music）增强
# 适用于 Youtube & Youtube Music

[rewrite_local]
^https:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config))(\?(.*))?$,requires-body=1,max-size=-1,binary-body-mode=1 url script-response-body https://raw.githubusercontent.com/Servant9527/Surge/main/JS%20folder/youtube.response.js
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&ack.*,requires-body=1,max-size=-1,binary-body-mode=1 url script-request-body https://raw.githubusercontent.com/Servant9527/Surge/main/JS%20folder/youtube.request.js
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event,requires-body=1,max-size=-1,binary-body-mode=1 url script-request-body https://raw.githubusercontent.com/Servant9527/Surge/main/JS%20folder/youtube.request.js

[mitm]
hostname =  *.googlevideo.com, youtubei.googleapis.com
