# 网易云音乐去广告
# 过滤网易云音乐广告，并允许自定义界面。

[rewrite_local]
(?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/(?:batch|v2\/resource\/comment\/floor\/get) url script-response-body https://raw.githubusercontent.com/Servant9527/Surge/main/JS%20folder/NeteaseCloudMusic_remove_ads.js
(?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/(?:homepage\/block\/page|link\/page\/rcmd\/(?:block\/resource\/multi\/refresh|resource\/show)) url script-response-body https://raw.githubusercontent.com/Servant9527/Surge/main/JS%20folder/NeteaseCloudMusic_remove_ads.js
(?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/link\/home\/framework\/tab url script-response-body https://raw.githubusercontent.com/Servant9527/Surge/main/JS%20folder/NeteaseCloudMusic_remove_ads.js
(?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/link\/page\/discovery\/resource\/show url script-response-body https://raw.githubusercontent.com/Servant9527/Surge/main/JS%20folder/NeteaseCloudMusic_remove_ads.js
(?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/link\/position\/show\/resource url script-response-body https://raw.githubusercontent.com/Servant9527/Surge/main/JS%20folder/NeteaseCloudMusic_remove_ads.js
(?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/user\/follow\/users\/mixed\/get url script-response-body https://raw.githubusercontent.com/Servant9527/Surge/main/JS%20folder/NeteaseCloudMusic_remove_ads.js

[mitm]
hostname =  interface*.music.163.com

